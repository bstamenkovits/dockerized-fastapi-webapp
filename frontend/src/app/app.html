<div class="container">
  <div class="card">
    <h1>{{ title() }}</h1>

    <div class="health-status">
      @if (isLoading()) {
        <div class="loading">
          <div class="spinner"></div>
          <p>{{ healthStatus() }}</p>
        </div>
      } @else if (error()) {
        <div class="error">
          <p>❌ {{ error() }}</p>
          <button (click)="checkHealth()" class="retry-btn">Retry</button>
        </div>
      } @else {
        <div class="success">
          <p>✅ Backend Status: <strong>{{ capitalizedHealthStatus() }}</strong></p>
          <button (click)="checkHealth()" class="retry-btn">Check Again</button>
        </div>
      }
    </div>
  </div>
</div>

<router-outlet />
